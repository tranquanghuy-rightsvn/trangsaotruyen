<!doctype html>
<html lang="vi">
  <head>
    {{HEAD}}
  </head>
  <body data-page="auth">
    {{HEADER}}
    <div class="breadcrumb-bar">
      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="/">🏠 Trang chủ</a>
        <span class="breadcrumb-extra"><span class="crumb-sep">/</span><span class="breadcrumb-current">Đăng nhập</span></span>
      </nav>
    </div>

    <!-- ================= FORM ĐĂNG NHẬP ================= -->
    <main class="auth-page">
      <div class="auth-card">
        <h1 class="auth-heading underline-title"><span class="auth-heading-icon">→]</span>Đăng nhập</h1>
        <div class="auth-divider"></div>

        <div class="auth-tabs">
          <a href="/login/" class="auth-tab is-active">Đăng nhập</a>
          <a href="/signup/" class="auth-tab">Đăng ký</a>
        </div>

        <form class="auth-form">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="text" id="login-email" name="email" required placeholder="Email">
          </div>
          <div class="form-group">
            <label for="login-password">Mật khẩu</label>
            <div class="password-field">
              <input type="password" id="login-password" name="password" required placeholder="Mật khẩu">
              <button type="button" class="toggle-password" aria-label="Hiện/Ẩn mật khẩu"></button>
            </div>
          </div>
          <div class="form-row-end">
            <a href="#">Quên mật khẩu?</a>
          </div>
          <p class="form-feedback"></p>
          <button type="submit" class="btn auth-submit-btn">Đăng nhập</button>
        </form>
      </div>
    </main>
    {{FOOTER}}
    <script src="/js/main.js?v={{ASSET_V}}"></script>
  </body>
</html>
