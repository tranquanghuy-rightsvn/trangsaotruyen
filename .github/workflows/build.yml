name: Build & deploy Trăng Sao Truyện

# Chỉ trigger ở đúng file LUÔN là commit chốt của mỗi thao tác CMS - không trigger theo cả
# thư mục data/** (sẽ chạy build ngay từ commit dở dang của một thao tác Lưu nhiều commit).
#   - data/stories.json      chốt của MỌI thao tác truyện/chương (gas/Code.js ghi SAU CÙNG),
#                            và cũng là nơi trigger đồng bộ lượt xem/đánh giá hằng ngày
#   - data/site-config.json  chốt của đổi thể loại / cài đặt site
# layouts/ (design), static/ (CSS/JS/ảnh), scripts/, worker/ là nguồn thật → đổi thì build lại.
# CỐ Ý không có templates/: đó chỉ là bản gốc để tham khảo, không tham gia build.
on:
  push:
    paths:
      - "data/stories.json"
      - "data/site-config.json"
      - "layouts/**"
      - "static/**"
      - "scripts/build.py"
      - "worker/**"
      - "wrangler.toml"
      # Chinh toolchain deploy cung phai chay lai de kiem: doi ban Node/wrangler ma khong
      # trigger thi loi chi lo ra o lan push noi dung tiep theo (da gap: CI fail vi Node 20).
      - ".github/workflows/build.yml"
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {}

# CỐ Ý không có `permissions: contents: write`: workflow này KHÔNG commit html/ trở lại repo.
# html/ đã được gitignore và là output 100% của build.py — commit lại sẽ khiến mỗi lần đồng bộ
# lượt xem hằng ngày tạo một commit đụng vào 2.030 file, phình repo vô ích. wrangler deploy đẩy
# thẳng thư mục html/ trong workspace của CI lên Cloudflare, không cần qua git.
permissions:
  contents: read

# Hai lần deploy chồng nhau sẽ tranh nhau ghi cùng một Worker; huỷ lần cũ, giữ lần mới nhất.
concurrency:
  group: deploy-trangsaotruyen
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build.py không dùng thư viện ngoài -> không có bước pip install nào.
      - name: Build site tĩnh
        run: python3 scripts/build.py

      # Nếu build ra HTML còn sót token {{...}} thì build.py đã tự fail ở trên (check_no_tokens).
      # Ở đây chỉ chốt lại 2 điều kiện hạ tầng mà build.py không biết.
      - name: Kiểm tra ngưỡng hạ tầng
        run: |
          set -e
          files=$(find html -name '*.html' | wc -l)
          echo "Số file HTML: $files"
          if [ "$files" -ge 20000 ]; then
            echo "::error::$files file HTML — vượt giới hạn 20.000 của Cloudflare Static Assets (free)."
            exit 1
          fi
          if [ ! -f html/_tpl/chapter.html ]; then
            echo "::error::Thiếu html/_tpl/chapter.html — Worker sẽ không render được trang chương."
            exit 1
          fi

      # Doc .nvmrc de CI va may local KHONG BAO GIO lech ban Node. Hard-code "20" o day tung
      # lam CI fail: wrangler 4.125 doi Node >=22, local dang chay v24 nen loi khong lo ra.
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # `npm ci` (không phải `npm install`) để CI dùng ĐÚNG bản wrangler trong
      # package-lock.json — cùng bản đã test trên máy. Dùng cloudflare/wrangler-action sẽ tự
      # tải bản mới nhất, tức deploy bằng một bản wrangler chưa ai chạy thử.
      - name: Cài wrangler đúng bản đã khoá
        run: npm ci

      # Deploy Worker + Static Assets. Cần 2 secret trong repo Settings > Secrets and
      # variables > Actions:
      #   CLOUDFLARE_API_TOKEN   quyền: Account > Workers Scripts > Edit
      #                                 Account > Account Settings > Read
      #   CLOUDFLARE_ACCOUNT_ID
      # KHÔNG cần quyền D1: đã kiểm bằng WRANGLER_LOG=debug — deploy chỉ gọi endpoint
      # /accounts/{id}/workers/*, không gọi /d1/ lần nào. Binding D1 chỉ là metadata gửi
      # kèm script settings. Chỉ cần D1 > Edit nếu sau này thêm bước `wrangler d1 ...` vào CI.
      - name: Deploy lên Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
